[project]
name = "stabilizer-ui"
version = "0.1"
description = "Stabilizer GUI to control an ARTIQ stabilizer over MQTT and visualise its data streams."
authors = [{ name = "OxfordIonTrapGroup" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "GPL-3.0-or-later"
dependencies = [
    "qasync>=0.27.1,<0.28",
    "pyqtgraph>=0.13.7,<0.14",
    "numpy>=2.2.5,<3",
    "gmqtt>=0.7.0,<0.8",
    "pyqt6>=6.9.0,<7",
    "stabilizer",
    "scipy>=1.13",
    "h5py>=3.11",
    # Automatic relocking (`l674`): the WAnD wavemeter RPC and the SolsTiS ICE-Bloc websocket.
    "sipyco",
    "websockets>=15",
]

[project.scripts]
stabilizer_ui = "stabilizer_ui.app:main"
dual_iir_ui = "stabilizer_ui.target.dual_iir.app:main"
fnc_ui = "stabilizer_ui.target.fnc.app:main"
current_sense_ui = "stabilizer_ui.target.current_sense.app:main"
l674_ui = "stabilizer_ui.target.l674.app:main"

[dependency-groups]
dev = [
    "poethepoet>=0.22.1,<0.23",
    "toml>=0.10.2,<0.11",
    "yapf==0.43.0",
    "flake8==7.1.1",
    "pytest>=8",
]
# The signal processing extension in `dsp/` (for the spectral density window, the transfer
# function measurements and recording at lower sample rates), which needs a Rust toolchain
# to build. Installed by default; leave it out with `uv sync --no-group dsp`, or for all
# uv commands by setting `UV_NO_GROUP=dsp`.
dsp = ["stabilizer-dsp"]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
sipyco = { git = "https://github.com/m-labs/sipyco.git" }
stabilizer = { git = "https://github.com/OxfordIonTrapGroup/stabilizer.git", subdirectory = "py", branch = "next" }
stabilizer-dsp = { path = "dsp" }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.poe.tasks]
fmt = "yapf -ir stabilizer_ui"
lint = "flake8 stabilizer_ui"
test = "pytest tests"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
