[package]
name = "stabilizer-dsp"
version = "0.1.0"
edition = "2021"
description = "Signal processing for stabilizer-ui: PSD estimation, decimation and transfer function analysis"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "stabilizer_dsp"
crate-type = ["cdylib"]

[dependencies]
# The firmware's sweep oscillator, for reproducing the excitation exactly. Keep the
# version equal to the one the firmware pins (stabilizer-stream depends on it too).
idsp = "0.21"
# The processing traits of idsp (the version it uses).
dsp-process = "0.2"
num-complex = "0.4"
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py312"] }
rayon = "1"
realfft = "3"
# The upstream library builds on Linux only, and with the dependencies of the egui app.
stabilizer-stream = { git = "https://github.com/OxfordIonTrapGroup/stabilizer-stream", branch = "portable-lib", default-features = false }

[profile.release]
opt-level = 3
