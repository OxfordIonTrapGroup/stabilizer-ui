[project]
name = "stabilizer-dsp"
version = "0.1.0"
description = "Signal processing for stabilizer-ui: PSD estimation, decimation and transfer function analysis"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"

[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[tool.uv]
# Rebuild when the Rust sources change, not only the metadata.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "stabilizer_dsp.pyi" },
]
